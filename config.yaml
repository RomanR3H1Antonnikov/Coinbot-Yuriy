intervals:
  meshok: 30
  auction: 60
  avito: 60

# Прямые ключевые слова — алерт без LLM-проверки (список от клиента)
keywords_direct:
  - заготовка
  - муляж
  - мул
  - ошибка
  - пробная
  - оттиск
  - разновидность
  - перепутка
  - без гуртовой надписи
  - двойная накатка гуртовой надписи
  - фальшивка
  - образец
  - инкуз
  - перечекан

# Приходят всегда: без LLM, без проверки на тиражку и без правил (годовик/копейки/до 1965/цена).
# Исключение — россыпи (лот из N монет). Слова сюда же попадают в direct и в общий список автоматически.
keywords_always:
  - гибрид

# Остальные ключевые слова — проходят LLM-проверку
keywords_llm:
  - несоосность
  - соосность
  - гашеная
  - брак
  - выкус
  - двойной выкус
  - тройной выкус
  - смещение
  - щель
  - без краски
  - поворот
  - несоостность
  - полный раскол
  - чечевица
  - непрочекан
  - соударение
  - легкая
  - тяжелая
  - лунка
  - вне кольца

# Все ключевые слова (объединение, используется keyword_filter)
keywords:
  - заготовка
  - муляж
  - мул
  - ошибка
  - пробная
  - оттиск
  - разновидность
  - перепутка
  - без гуртовой надписи
  - двойная накатка гуртовой надписи
  - фальшивка
  - образец
  - инкуз
  - перечекан
  - гашеная
  - брак
  - выкус
  - двойной выкус
  - тройной выкус
  - смещение
  - щель
  - без краски
  - поворот
  - несоостность
  - полный раскол
  - чечевица
  - непрочекан
  - соударение
  - легкая
  - тяжелая
  - лунка
  - вне кольца

